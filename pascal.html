<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piñata de Revelación</title>
<style>
/* ---------------------------------------------------
   FUENTE GENERAL + FONDO
--------------------------------------------------- */
body {
  margin: 0;
  padding: 0;
  font-family: "Poppins", sans-serif;

  background: linear-gradient(135deg, #ff69b4, #80c0ff);
  background-attachment: fixed;
  background-size: cover;

  padding-top: 100px !important; /* Para que el navbar no tape el contenido */
}

/* ---------------------------------------------------
   NAVBAR
--------------------------------------------------- */
.navbar {
  width: 100%;
  position: fixed;
  top: 0;
  left: 0;
  z-index: 9999;

  background: rgba(255, 255, 255, 0.30);
  backdrop-filter: blur(12px);
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);

  display: flex;
  justify-content: center;
  padding: 12px 0;
}

.nav-container {
  width: 95%;
  max-width: 1200px;

  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  height: 60px;
  width: auto;
  border-radius: 10px;
  object-fit: cover;
}

/* LINKS */
.nav-links {
  display: flex;
  gap: 25px;
  list-style: none;
}

.nav-links li {
  list-style: none;
}

.nav-links a {
  text-decoration: none;
  font-size: 18px;
  color: #222;
  padding: 8px 14px;
  border-radius: 12px;
  transition: 0.2s;
}

.nav-links a:hover {
  background: rgba(255,255,255,0.6);
  transform: scale(1.05);
}

/* MENU MOVIL */
.menu-toggle {
  display: none;
  font-size: 26px;
  cursor: pointer;
  color: #222;
}

/* RESPONSIVE */
@media (max-width: 768px) {

  .menu-toggle {
    display: block;
  }

  .nav-links {
    display: none;
    position: absolute;
    top: 85px;
    right: 0;
    width: 100%;
    flex-direction: column;
    text-align: center;
    gap: 25px;
    background: rgba(255,255,255,0.4);
    padding: 15px 0;
    backdrop-filter: blur(10px);
  }

  .nav-links.show {
    display: flex;
  }
}

/* ---------------------------------------------------
   TITULO
--------------------------------------------------- */
.titulo-principal {
  margin: 40px 0;
  font-size: 2.4rem;
  font-weight: 800;
  text-align: center;
}

/* ---------------------------------------------------
   TÍTULO PRINCIPAL
--------------------------------------------------- */
.titulo-principal {
  margin-top: 40px;
  font-size: 2.4rem;
  color: #222;
  font-weight: 800;
}

/* ---------------------------------------------------
   CONTENEDOR PRINCIPAL (GENÉRICO)
--------------------------------------------------- */
.contenedor-principal {
  max-width: 1400px;
  margin: 40px auto;
  padding: 20px;
}

/* ---------------------------------------------------
   GALERÍA DE PRODUCTOS
--------------------------------------------------- */
.galeria {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 25px;
  margin: 40px 20px;
}

/* ---------------------------------------------------
   TARJETA DE PRODUCTO - EFECTO GLASS
--------------------------------------------------- */
.tarjeta-producto {
  background: rgba(255, 255, 255, 0.18);
  border-radius: 20px;
  padding: 15px;
  text-align: center;
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.35);
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.20);
  transition:
    transform 0.35s ease,
    box-shadow 0.35s ease,
    background 0.35s ease;
  position: relative;
  overflow: hidden;
}

/* Hover */
.tarjeta-producto:hover {
  transform: translateY(-10px) scale(1.03);
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.30);
  background: rgba(255, 255, 255, 0.28);
}

/* Imagen */
.tarjeta-producto img,
.producto-img {
  width: 100%;
  height: 230px;
  object-fit: cover;
  border-radius: 15px;
  transition: transform 0.4s ease;
}

/* Zoom */
.tarjeta-producto:hover img {
  transform: scale(1.1);
}

/* ---------------------------------------------------
   CORAZÓN DE FAVORITOS
--------------------------------------------------- */
.corazon-btn,
.favorito {
  position: absolute;
  top: 10px;
  right: 10px;
  font-size: 28px;
  cursor: pointer;
  color: #ffffff;
  transition: 0.3s;
  text-shadow: 0px 0px 5px rgba(255,255,255,0.7);
  z-index: 20;
}

.corazon-btn.activo,
.favorito.activo {
  color: red;
  transform: scale(1.2);
}

.corazon-btn:hover,
.favorito:hover {
  transform: scale(1.25);
}

/* ---------------------------------------------------
   INFO DEL PRODUCTO EN GALERÍA
--------------------------------------------------- */
.info-producto h2 {
  margin: 12px 0 6px;
  font-size: 1.3rem;
  font-weight: 700;
  color: #222;
}

.info-producto p {
  margin: 0;
  font-size: 1rem;
  color: #444;
}

.precio {
  font-size: 1.2rem;
  color: #ff4081;
  font-weight: bold;
  margin-top: 10px;
}

/* ---------------------------------------------------
   BOTÓN VER MÁS
--------------------------------------------------- */
.boton-ver {
  display: inline-block;
  margin-top: 12px;
  padding: 10px 18px;
  background: #0a0a23;
  color: white;
  border-radius: 30px;
  text-decoration: none;
  transition: 0.3s;
}

.boton-ver:hover {
  background: #ff4081;
}

/* ---------------------------------------------------
   PÁGINA DE PRODUCTO INDIVIDUAL
   IMAGEN IZQUIERDA - TEXTO DERECHA (GLASS)
--------------------------------------------------- */
.producto-contenedor {
  max-width: 1200px;
  margin: 40px auto;
  padding: 20px;

  display: flex;
  gap: 30px;

  background: rgba(255, 255, 255, 0.18);
  backdrop-filter: blur(12px);
  border-radius: 20px;
  border: 1px solid rgba(255, 255, 255, 0.35);
  box-shadow: 0 4px 18px rgba(0,0,0,0.25);
}

/* IMAGEN IZQUIERDA */
.producto-imagen {
  flex: 1;
}

.producto-imagen img {
  width: 100%;
  border-radius: 20px;
  height: 800px;
  object-fit: cover;
  transition: 0.4s ease;
}

.producto-imagen img:hover {
  transform: scale(1.05);
}

/* INFO DERECHA */
.producto-info {
  flex: 1;
  text-align: left;
  padding: 20px;
}

.producto-info h1 {
  font-size: 2rem;
  font-weight: 800;
  color: #222;
}

.descripcion {
  margin-top: 10px;
  font-size: 1.1rem;
  color: #333;
  line-height: 2;
}

.precio-detalle {
  margin-top: 20px;
  font-size: 1.6rem;
  font-weight: bold;
  color: #ff4081;
}

/* ---------------------------------------------------
  boton cotizra piñata por wahtsapp web
-----------------------------------------------------*/
.boton-ver{
  display:inline-block;
  margin-top:20px;
  padding:14px 24px;
  background:#25D366;
  color:white;
  border-radius:40px;
  text-decoration:none;
  font-weight:700;
  font-size:16px;
  transition:0.3s ease;
  box-shadow:0 6px 15px rgba(0,0,0,0.25);
}

.boton-ver:hover{
  transform:translateY(-3px);
  background:#1ebe5d;
  box-shadow:0 10px 20px rgba(0,0,0,0.3);
}

/* RESPONSIVE PRODUCTO */
@media (max-width: 900px) {
  .producto-contenedor {
    flex-direction: column;
  }

  .producto-info {
    text-align: center;
  }
}

/* USUARIO */
.usuario-area{
  display:flex;
  align-items:center;
  gap:12px;
}

.usuario-info{
  display:flex;
  align-items:center;
  gap:10px;
  background:rgba(255,255,255,0.35);
  padding:8px 14px;
  border-radius:50px;
  backdrop-filter:blur(10px);
}

.usuario-info img{
  width:45px;
  height:45px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid white;
}

.usuario-info span{
  font-weight:600;
  color:#222;
}

/*codigo para la letra inicial del usuario*/
.avatar-letra{
  width:45px;
  height:45px;
  border-radius:50%;
  background:#ff4081;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  font-weight:700;
}

.btn-cerrar{
  border:none;
  background:#ff4081;
  color:white;
  padding:10px 18px;
  border-radius:30px;
  cursor:pointer;
  font-weight:700;
  transition:0.3s;
}

.btn-cerrar:hover{
  transform:scale(1.05);
  background:#e73370;
}

</style>
</head>
<body>

    <!-- NAVBAR (TUYA ORIGINAL) -->
    <nav class="navbar">
        <div class="nav-container">

            <a href="index.html">
                <img src="PIÑATAS/logo.jpg" class="logo" alt="Logo MAR PIÑATAS">
            </a>

            <div class="menu-toggle" id="menu-toggle">☰</div>

<ul class="nav-links" id="nav-links">

  <li><a href="index.html">🏠 Inicio</a></li>
  <li><a href="FAVORITO.html">❤️ Favoritos</a></li>
  <!-- BOTON LOGIN -->
  <li id="btnLogin">
    <a href="login.html">🧑‍💼 Iniciar Sesión</a>
  </li>
  <!-- AREA USUARIO -->
  <li class="usuario-area" id="usuarioArea" style="display:none;">
    <div class="usuario-info">
<div id="fotoUsuario" class="avatar-letra"></div>
      <span id="nombreUsuario"></span>
    </div>
    <button class="btn-cerrar" onclick="cerrarSesion()">
      Salir
    </button>
  </li>
</ul>
</div>
</nav>

    <!-- ------------------------------ -->
    <!--   CONTENEDOR PRINCIPAL PRODUCTO -->
    <!-- ------------------------------ -->
    <div class="producto-contenedor">

        <!-- IMAGEN IZQUIERDA -->
        <div class="producto-imagen">
            <img src="PIÑATAS/CAMALION.jpg" alt="Piñata Sulivan">
        </div>

        <!-- DESCRIPCIÓN DERECHA -->
        <div class="producto-info">
            <h1>Piñata Enredados</h1>
            <p class="descripcion">
                Pascal 
                ¡Cuando tu mejor amigo te convence de usar vestido! 👗🫢
                Amamos recrear los momentos más divertidos de las peliculas.
                Pascal listo para llenar de risas y color tu celebración. 😊🪅
            </p>
                <a 
href="https://wa.me/5214641313171?text=Hola,%20quiero%20solicitar%20una%20cotización%20para%20la%20piñata%20de%20Pascal%20🎉" 
class="boton-ver" 
target="_blank">
📋 Solicitar cotización
</a>
        </div>

    </div>

<script>
    // Menú móvil
    document.getElementById("menu-toggle").onclick = () => {
        document.getElementById("nav-links").classList.toggle("show");
    };

// -------------------------------
// MENÚ MÓVIL
// -------------------------------
document.getElementById("menu-toggle").onclick = () => {
    document.getElementById("nav-links").classList.toggle("show");
};

/* USUARIO ACTIVO */
const usuarioActivo =
  JSON.parse(localStorage.getItem("usuarioActivo"));

if(usuarioActivo){

  /* MOSTRAR AREA USUARIO */
  document.getElementById("usuarioArea").style.display = "flex";

  /* OCULTAR LOGIN */
  document.getElementById("btnLogin").style.display = "none";

  /* NOMBRE */
  document.getElementById("nombreUsuario").textContent =
    usuarioActivo.nombre || "Usuario";

/* INICIAL DEL NOMBRE */
document.getElementById("fotoUsuario").textContent =
  usuarioActivo.nombre.charAt(0).toUpperCase();

}

function cerrarSesion(){

  // ELIMINAR SESION
  localStorage.removeItem("usuarioActivo");

  // ELIMINAR FAVORITOS
  localStorage.removeItem("favoritos");

  // RECARGAR PAGINA
  window.location.reload();

}


</script>

</body>
</html>
