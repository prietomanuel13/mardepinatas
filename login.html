<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión - MAR PIÑATAS</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #ff69b4, #80c0ff);
      background-attachment: fixed;
      background-size: cover;
      text-align: center;
      color: #333;
    }

    .navbar {
      width: 100%;
      height: 120px;
      background: rgba(10, 10, 35, 0.7);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.3);
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }

    .nav-container {
      width: 100%;
      max-width: 1400px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      height: 70px;
      border-radius: 10px;
    }

    .nav-links {
      list-style: none;
      display: flex;
      gap: 25px;
      margin: 0;
      padding: 0;
    }

    .nav-links li a {
      color: white;
      text-decoration: none;
      font-size: 1.2rem;
      transition: 0.3s;
    }

    .nav-links li a:hover {
      color: #ff4081;
    }

    .login-box {
      max-width: 400px;
      margin: 80px auto;
      padding: 30px;
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.35);
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    }

    .login-box h2 {
      margin-bottom: 20px;
      color: #222;
      font-size: 1.8rem;
    }

    .login-box input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 25px;
      border: none;
      outline: none;
      font-size: 1rem;
    }

    .login-box button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      background: #0a0a23;
      color: white;
      border: none;
      border-radius: 30px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: 0.3s;
    }

    .login-box button:hover {
      background: #ff4081;
    }

    .login-box a {
      color: #0a0a23;
      font-weight: bold;
      text-decoration: none;
    }

    .login-box a:hover {
      color: #ff4081;
    }

    /*mensaje visual al iniciar sesion*/
    #msg{
  margin-top:15px;
  font-weight:600;
  font-size:15px;
}

.success{
  color:#0f9d58;
}

.error{
  color:#d93025;
}
  </style>
</head>
<body>

<nav class="navbar">
  <div class="nav-container">
    <a href="index.html">
      <img src="PIÑATAS/logo.jpg" class="logo" alt="Logo MAR PIÑATAS">
    </a>
    <ul class="nav-links">
      <li><a href="index.html">🏠 Inicio</a></li>
      <li><a href="login.html">🔐 Iniciar Sesión</a></li>
    </ul>
  </div>
</nav>

<div class="login-box">
  <h2>Iniciar Sesión</h2>

  <!-- FORM CORREGIDO -->
  <form id="formLogin">
    <input type="email" id="correo" placeholder="Correo electrónico" required>
    <input type="password" id="password" placeholder="Contraseña" required>
    <button type="submit">Entrar</button>
  </form>

  <p>¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
  <p id="msg"></p>
</div>

<script>

/* AUTO LOGIN */
const usuarioActivo =
  JSON.parse(localStorage.getItem("usuarioActivo"));

if(usuarioActivo){

  window.location.href = "index.html";

}
const form = document.getElementById("formLogin");

form.addEventListener("submit", function(e){

  e.preventDefault();

  const correo =
    document.getElementById("correo").value.trim();

  const password =
    document.getElementById("password").value.trim();

  const msg =
    document.getElementById("msg");

  /* OBTENER USUARIOS */
  const usuarios =
    JSON.parse(localStorage.getItem("usuarios")) || [];

  /* BUSCAR USUARIO */
  const usuario =
    usuarios.find(
      u => u.correo === correo &&
           u.password === password
    );

  /* LOGIN CORRECTO */
  if(usuario){

    /* GUARDAR SESION */
    localStorage.setItem(
      "usuarioActivo",
      JSON.stringify(usuario)
    );

    msg.textContent = "Inicio de sesión exitoso ✅";
    msg.className = "success";

    /* REDIRECCION */
    setTimeout(() => {

      window.location.href = "index.html";

    }, 1000);

  }

  /* LOGIN INCORRECTO */
  else{

    msg.textContent =
      "Correo o contraseña incorrectos ❌";

    msg.className = "error";

  }

});

</script>

</body>
</html>
