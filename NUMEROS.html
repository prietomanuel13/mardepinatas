<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAR PIÑATAS</title>
 

  <style>
/* ---------------------------------------------------
   FUENTE GENERAL + FONDO
--------------------------------------------------- */
body {
  margin: 0;
  padding: 0;
  font-family: "Poppins", sans-serif;

  background: linear-gradient(135deg, #ff69b4, #80c0ff);
  background-attachment: fixed;
  background-size: cover;

  padding-top: 100px !important; /* Para que el navbar no tape el contenido */
}

/* ---------------------------------------------------
   NAVBAR
--------------------------------------------------- */
.navbar {
  width: 100%;
  position: fixed;
  top: 0;
  left: 0;
  z-index: 9999;

  background: rgba(255, 255, 255, 0.30);
  backdrop-filter: blur(12px);
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);

  display: flex;
  justify-content: center;
  padding: 12px 0;
}

.nav-container {
  width: 95%;
  max-width: 1200px;

  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  height: 60px;
  width: auto;
  border-radius: 10px;
  object-fit: cover;
}

/* LINKS */
.nav-links {
  display: flex;
  gap: 25px;
  list-style: none;
}

.nav-links li {
  list-style: none;
}

.nav-links a {
  text-decoration: none;
  font-size: 18px;
  color: #222;
  padding: 8px 14px;
  border-radius: 12px;
  transition: 0.2s;
}

.nav-links a:hover {
  background: rgba(255,255,255,0.6);
  transform: scale(1.05);
}

/* MENU MOVIL */
.menu-toggle {
  display: none;
  font-size: 26px;
  cursor: pointer;
  color: #222;
}

/* RESPONSIVE */
@media (max-width: 768px) {

  .menu-toggle {
    display: block;
  }

  .nav-links {
    display: none;
    position: absolute;
    top: 85px;
    right: 0;
    width: 100%;
    flex-direction: column;
    text-align: center;
    gap: 25px;
    background: rgba(255,255,255,0.4);
    padding: 15px 0;
    backdrop-filter: blur(10px);
  }

  .nav-links.show {
    display: flex;
  }
}

/* ---------------------------------------------------
   TITULO
--------------------------------------------------- */
.titulo-principal {
  margin: 40px 0;
  font-size: 2.4rem;
  font-weight: 800;
  text-align: center;
}

/* ---------------------------------------------------
   CONTENEDOR PRINCIPAL
--------------------------------------------------- */
.contenedor-principal {
  max-width: 1400px;
  margin: 40px auto;
  padding: 20px;
}

/* ---------------------------------------------------
   GALERÍA DE PRODUCTOS
--------------------------------------------------- */
.galeria {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 25px;
  margin: 40px 20px;
}

/* ---------------------------------------------------
   TARJETA DE PRODUCTO - EFECTO GLASS
--------------------------------------------------- */
.tarjeta-producto {
  background: rgba(255, 255, 255, 0.18);
  border-radius: 20px; /* EL VOLOR ORIGINAL ERA 2OPX*/
  padding: 15px;
  text-align: center;
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.35);
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.20);
  transition:
    transform 0.35s ease,
    box-shadow 0.35s ease,
    background 0.35s ease;
  position: relative;
  overflow: hidden;
}

/* Hover */
.tarjeta-producto:hover {
  transform: translateY(-10px) scale(1.03);
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.30);
  background: rgba(255, 255, 255, 0.28);
}

/* Imagen */
.tarjeta-producto img,
.producto-img {
  width: 100%;
  height: 230px;
  object-fit: cover;
  border-radius: 15px;
  transition: transform 0.4s ease;
}

/* Zoom */
.tarjeta-producto:hover img {
  transform: scale(1.1);
}

/* ---------------------------------------------------
   CORAZÓN DE FAVORITOS
--------------------------------------------------- */
.corazon-btn,
.favorito {
  position: absolute;
  top: 10px;
  right: 10px;
  font-size: 28px;
  cursor: pointer;
  color: #ffffff;
  transition: 0.3s;
  text-shadow: 0px 0px 5px rgba(255,255,255,0.7);
  z-index: 20;
}

.corazon-btn.activo,
.favorito.activo {
  color: red;
  transform: scale(1.2);
}

.corazon-btn:hover,
.favorito:hover {
  transform: scale(1.25);
}

/* ---------------------------------------------------
   INFO DEL PRODUCTO
--------------------------------------------------- */
.info-producto h2 {
  margin: 12px 0 6px;
  font-size: 1.3rem;
  font-weight: 700;
  color: #222;
}

.info-producto p {
  margin: 0;
  font-size: 1rem;
  color: #444;
}

.precio {
  font-size: 1.2rem;
  color: #ff4081;
  font-weight: bold;
  margin-top: 10px;
}

/* ---------------------------------------------------
   BOTÓN VER MÁS
--------------------------------------------------- */
.boton-ver {
  display: inline-block;
  margin-top: 12px;
  padding: 10px 18px;
  background: #0a0a23;
  color: white;
  border-radius: 30px;
  text-decoration: none;
  transition: 0.3s;
}

.boton-ver:hover {
  background: #ff4081;
}

/* USUARIO */
.usuario-area{
  display:flex;
  align-items:center;
  gap:12px;
}

.usuario-info{
  display:flex;
  align-items:center;
  gap:10px;
  background:rgba(255,255,255,0.35);
  padding:8px 14px;
  border-radius:50px;
  backdrop-filter:blur(10px);
}

.usuario-info img{
  width:45px;
  height:45px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid white;
}

.usuario-info span{
  font-weight:600;
  color:#222;
}

/*codigo para la letra inicial del usuario*/
.avatar-letra{
  width:45px;
  height:45px;
  border-radius:50%;
  background:#ff4081;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  font-weight:700;
}

.btn-cerrar{
  border:none;
  background:#ff4081;
  color:white;
  padding:10px 18px;
  border-radius:30px;
  cursor:pointer;
  font-weight:700;
  transition:0.3s;
}

.btn-cerrar:hover{
  transform:scale(1.05);
  background:#e73370;
}

  </style>

</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-container">

      <a href="index.html">
        <img src="PIÑATAS/logo.jpg" class="logo" alt="Logo MAR PIÑATAS">
      </a>

      <div class="menu-toggle" id="menu-toggle">☰</div>

      <ul class="nav-links" id="nav-links">

  <li><a href="index.html">🏠 Inicio</a></li>
  <li><a href="FAVORITO.html">❤️ Favoritos</a></li>
  <!-- BOTON LOGIN -->
  <li id="btnLogin">
    <a href="login.html">🧑‍💼 Iniciar Sesión</a>
  </li>

  <!-- AREA USUARIO -->
  <li class="usuario-area" id="usuarioArea" style="display:none;">

    <div class="usuario-info">

<div id="fotoUsuario" class="avatar-letra"></div>

      <span id="nombreUsuario"></span>

    </div>

    <button class="btn-cerrar" onclick="cerrarSesion()">
      Salir
    </button>

  </li>

</ul>

    </div>
  </nav>

  <!-- TÍTULO -->
  <h1 class="titulo-principal">NÚMEROS PERSONALIZADOS</h1>

  <!-- GALERÍA DE PRODUCTOS -->
  <div class="galeria">

    <!-- PRODUCTO 1 Jefe en pañales -->
    <div class="tarjeta-producto" data-id="ted" data-img="PIÑATAS/Jefe en pañales 1.jpg" data-titulo="Piñata Jefe en pañales" data-descripcion="Boss Baby Ted">
      <div class="corazon-btn">♥</div>
      <a href="ted.html">
      <img src="PIÑATAS/Jefe en pañales 1.jpg" alt="Piñata jefe en pañales">
    </a>
      <div class="info-producto">
        <h2>Piñata Jefe en pañales</h2>
        <p>Boss Baby Ted</p>
      </div>
    </div>

    <!-- PRODUCTO 2 Paw Patrol -->
    <div class="tarjeta-producto" data-id="pawpatrol" data-img="PIÑATAS/Paw-patrol-_3.jpg" data-titulo="Piñata de caricatura" data-descripcion="Paw Patrol">
      <div class="corazon-btn">♥</div>
      <a href="pawpatrol.html">
      <img src="PIÑATAS/Paw-patrol-_3.jpg" alt="Piñata Paw patrol 3">
    </a>
      <div class="info-producto">
        <h2>Piñata de caricatura</h2>
        <p>Paw Patrol</p>
      </div>
    </div>

    <!-- PRODUCTO 3 Boo -->
    <div class="tarjeta-producto" data-id="boo" data-img="PIÑATAS/Moster ing 3.jpg" data-titulo="Piñata Moster Inc" data-descripcion="Boo">
      <div class="corazon-btn">♥</div>
      <a href="boo.html">
      <img src="PIÑATAS/Moster ing 3.jpg" alt="Piñata Moster inc 3">
    </a>
      <div class="info-producto">
        <h2>Piñata Moster Inc </h2>
        <p>Boo</p>
      </div>
    </div>

    <!-- PRODUCTO 4 jessi-->
    <div class="tarjeta-producto" data-id="jessi" data-img="PIÑATAS/BAQUERA.jpg" data-titulo="Piñata Toy Story Jessi" data-descripcion="Vaquerita Jessi">
      <div class="corazon-btn">♥</div>
      <a href="jessi.html">
      <img src="PIÑATAS/BAQUERA.jpg" alt="Piñata Jessi">
    </a>
      <div class="info-producto">
        <h2>Piñata Toy Story</h2>
        <p>Vaquerita Jessi</p>

    </div>

    <!-- PRODUCTO 5 hulk -->
    <div class="tarjeta-producto" data-id="hulk" data-img="PIÑATAS/HULK.jpg" data-titulo="Piñata Hulk Avengers" data-descripcion="Hulk">
      <div class="corazon-btn">♥</div>
      <a href="hulk.html">
      <img src="PIÑATAS/HULK.jpg" alt="Piñata Hulk">
    </a>
      <div class="info-producto">
        <h2>Piñata Avengers</h2>
        <p>Hulk</p>
      </div>

    <!-- PRODUCTO 6 spiderman-->
    <div class="tarjeta-producto" data-id="spiderman" data-img="PIÑATAS/ARAÑA.jpg" data-titulo="Piñata Spiderman Avengers" data-descripcion="Spiderman">
      <div class="corazon-btn">♥</div>
      <a href="spiderman.html">
      <img src="PIÑATAS/ARAÑA.jpg" alt="Piñata Spiderman">
    </a>
      <div class="info-producto">
        <h2>Piñata Avengers</h2>
        <p>Spiderman</p>
      </div>
    </div>
          
  </div>

  <!-- SCRIPT -->
  <script>
    // Menú
    const menuToggle = document.getElementById("menu-toggle");
    const navLinks = document.getElementById("nav-links");
    menuToggle.addEventListener("click", () => navLinks.classList.toggle("show"));

// FAVORITOS CON VALIDACION DE SESION
document.querySelectorAll(".corazon-btn").forEach(corazon => {

  corazon.addEventListener("click", e => {

    e.stopPropagation();

    // VERIFICAR SESION
    const usuarioActivo =
      JSON.parse(localStorage.getItem("usuarioActivo"));

    // SI NO HAY SESION
    if(!usuarioActivo){

      alert("Debes iniciar sesión para agregar favoritos ❤️");

      window.location.href = "login.html";

      return;
    }

    // DATOS DEL PRODUCTO
    const card = corazon.parentElement;

    const id = card.dataset.id;
    const img = card.dataset.img;
    const titulo = card.dataset.titulo;
    const descripcion = card.dataset.descripcion;

    // OBTENER FAVORITOS
    let favoritos =
      JSON.parse(localStorage.getItem("favoritos")) || [];

    // SI NO EXISTE -> AGREGAR
    if (!favoritos.some(f => f.id === id)) {

      favoritos.push({
        id,
        img,
        titulo,
        descripcion
      });

      corazon.classList.add("activo");

      alert("Producto agregado a favoritos ❤️");

    } else {

      // ELIMINAR FAVORITO
      favoritos =
        favoritos.filter(f => f.id !== id);

      corazon.classList.remove("activo");

      alert("Producto eliminado de favoritos ❌");
    }

    // GUARDAR
    localStorage.setItem(
      "favoritos",
      JSON.stringify(favoritos)
    );

  });

});

    // Abrir página individual
    document.querySelectorAll(".tarjeta-producto").forEach(card => {
      card.addEventListener("click", e => {
        if (e.target.classList.contains("corazon-btn")) return;
        window.location.href = card.dataset.id + ".html";
      });
    });

// -------------------------------
// MENÚ MÓVIL
// -------------------------------
document.getElementById("menu-toggle").onclick = () => {
    document.getElementById("nav-links").classList.toggle("show");
};

/* USUARIO ACTIVO */
const usuarioActivo =
  JSON.parse(localStorage.getItem("usuarioActivo"));

if(usuarioActivo){

  /* MOSTRAR AREA USUARIO */
  document.getElementById("usuarioArea").style.display = "flex";

  /* OCULTAR LOGIN */
  document.getElementById("btnLogin").style.display = "none";

  /* NOMBRE */
  document.getElementById("nombreUsuario").textContent =
    usuarioActivo.nombre || "Usuario";

/* INICIAL DEL NOMBRE */
document.getElementById("fotoUsuario").textContent =
  usuarioActivo.nombre.charAt(0).toUpperCase();

}

function cerrarSesion(){

  // ELIMINAR SESION
  localStorage.removeItem("usuarioActivo");

  // ELIMINAR FAVORITOS
  localStorage.removeItem("favoritos");

  // RECARGAR PAGINA
  window.location.reload();

}

  </script>

</body>
</html>
