<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Favoritos - MAR PIÑATAS</title>

  <style>
body {
  margin: 0;
  padding: 0;
  font-family: "Poppins", sans-serif;

  background: linear-gradient(135deg, #ff69b4, #80c0ff);
  background-attachment: fixed;
  background-size: cover;

  padding-top: 100px !important; /* Para que el navbar no tape el contenido */
}

/* ---------------------------------------------------
   NAVBAR (CORREGIDO)
--------------------------------------------------- */
.navbar {
  width: 100%;
  position: fixed;
  top: 0;
  left: 0;
  z-index: 9999;

  background: rgba(255, 255, 255, 0.30);
  backdrop-filter: blur(12px);
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);

  display: flex;
  justify-content: center;
  padding: 12px 0;
}

.nav-container {
  width: 95%;
  max-width: 1200px;

  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  height: 60px;
  width: auto;
  border-radius: 10px;
  object-fit: cover;
}

/* Links del menú */
.nav-links {
  display: flex;
  gap: 25px;
  list-style: none;
}

.nav-links li {
  list-style: none;
}

.nav-links a {
  text-decoration: none;
  font-size: 18px;
  color: #222;
  padding: 8px 14px;
  border-radius: 12px;
  transition: 0.2s;
}

.nav-links a:hover {
  background: rgba(255,255,255,0.6);
  transform: scale(1.05);
}

/* Ícono menú (móvil) */
.menu-toggle {
  display: none;
  font-size: 26px;
  cursor: pointer;
  color: #222;
}

/* ------------------------- RESPONSIVE ------------------------- */
@media (max-width: 768px) {

  .menu-toggle {
    display: block;
  }

  .nav-links {
    display: none;
    position: absolute;
    top: 85px;
    right: 0;
    width: 100%;
    flex-direction: column;
    text-align: center;
    gap: 25px;
    background: rgba(255,255,255,0.4);
    padding: 15px 0;
    backdrop-filter: blur(10px);
  }

  .nav-links.show {
    display: flex;
  }
}

/* ---------------------------------------------------
   TÍTULO PRINCIPAL DEL CARRITO
--------------------------------------------------- */
h1 {
  text-align: center;
  font-size: 2.4rem;
  margin-top: 30px;
  color: #222;
}

    .contenedor-principal {
      max-width: 1400px;
      margin: 40px auto;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 25px;
    }

    .tarjeta-producto {
  background: rgba(255, 255, 255, 0.18);
  border-radius: 20px;
  padding: 15px;
  text-align: center;
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.35);
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.20);
  transition: 0.35s;
  position: relative;
  overflow: hidden;
  max-width: 350px;   /* evita tarjetas gigantes */
  margin: auto;
}


    .tarjeta-producto:hover {
      transform: translateY(-10px) scale(1.03);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.30);
      background: rgba(255, 255, 255, 0.28);
    }

    .producto-img {
  width: 100%;
  height: 250px;        /* altura fija bonita */
  object-fit: contain; /* no recorta la imagen */
  border-radius: 15px;
  background: white;
}


    .tarjeta-producto:hover .producto-img {
      transform: scale(1.1);
    }

    .favorito {
      position: absolute;
      top: 12px;
      right: 12px;
      font-size: 30px;
      cursor: pointer;
      color: red;
      z-index: 10;
      transition: 0.3s;
      text-shadow: 0px 0px 6px rgba(255,255,255,0.8);
    }

    .favorito:hover {
      transform: scale(1.25);
    }

    .tarjeta-producto p {
      margin: 6px 0;
      font-size: 1rem;
      color: #333;
    }

/* USUARIO */
.usuario-area{
  display:flex;
  align-items:center;
  gap:12px;
}

.usuario-info{
  display:flex;
  align-items:center;
  gap:10px;
  background:rgba(255,255,255,0.35);
  padding:8px 14px;
  border-radius:50px;
  backdrop-filter:blur(10px);
}

.usuario-info img{
  width:45px;
  height:45px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid white;
}

.usuario-info span{
  font-weight:600;
  color:#222;
}

/*codigo para la letra inicial del usuario*/
.avatar-letra{
  width:45px;
  height:45px;
  border-radius:50%;
  background:#ff4081;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  font-weight:700;
}


.btn-cerrar{
  border:none;
  background:#ff4081;
  color:white;
  padding:10px 18px;
  border-radius:30px;
  cursor:pointer;
  font-weight:700;
  transition:0.3s;
}

.btn-cerrar:hover{
  transform:scale(1.05);
  background:#e73370;
}


  </style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html">
        <img src="PIÑATAS/logo.jpg" class="logo" alt="Logo MAR PIÑATAS">
      </a>
      <div class="menu-toggle" id="menu-toggle">☰</div>
<ul class="nav-links" id="nav-links">
  <li><a href="index.html">🏠 Inicio</a></li>
  <li><a href="FAVORITO.html">❤️ Favoritos</a></li>
  <!-- BOTON LOGIN -->
  <li id="btnLogin">
    <a href="login.html">🧑‍💼 Iniciar Sesión</a>
  </li>
  <!-- AREA USUARIO -->
  <li class="usuario-area" id="usuarioArea" style="display:none;">
    <div class="usuario-info">
<div id="fotoUsuario" class="avatar-letra"></div>
      <span id="nombreUsuario"></span>
    </div>
    <button class="btn-cerrar" onclick="cerrarSesion()">
      Salir
    </button>
</li>
</ul>
</div>
</nav>

  <h1>Mis Favoritos</h1>
  <div class="contenedor-principal" id="contenedor-favoritos"></div>

  <script>
    const contenedor = document.getElementById('contenedor-favoritos');
    const favs = JSON.parse(localStorage.getItem('favoritos')) || [];

    favs.forEach(fav => {
      const tarjeta = document.createElement('div');
      tarjeta.className = "tarjeta-producto";
      tarjeta.dataset.id = fav.id;

      tarjeta.innerHTML = `
        <div class="favorito">♥</div>
        <img src="${fav.img}" class="producto-img">
        <p>${fav.titulo}</p>
        <p>${fav.descripcion}</p>
      `;

      contenedor.appendChild(tarjeta);

      tarjeta.querySelector('.favorito').addEventListener('click', e => {
        e.stopPropagation();
        let favoritos = JSON.parse(localStorage.getItem('favoritos')) || [];
        favoritos = favoritos.filter(f => f.id !== fav.id);
        localStorage.setItem('favoritos', JSON.stringify(favoritos));
        tarjeta.remove();
      });

      tarjeta.addEventListener("click", () => {
        window.location.href = fav.id + ".html";
      });
    });

    const menuToggle = document.getElementById("menu-toggle");
    const navLinks = document.getElementById("nav-links");
    menuToggle.addEventListener("click", () => {
      navLinks.classList.toggle("show");
    });

/* USUARIO ACTIVO */
const usuarioActivo =
  JSON.parse(localStorage.getItem("usuarioActivo"));

if(usuarioActivo){

  /* MOSTRAR AREA USUARIO */
  document.getElementById("usuarioArea").style.display = "flex";

  /* OCULTAR LOGIN */
  document.getElementById("btnLogin").style.display = "none";

  /* NOMBRE */
  document.getElementById("nombreUsuario").textContent =
    usuarioActivo.nombre || "Usuario";

/* INICIAL DEL NOMBRE */
document.getElementById("fotoUsuario").textContent =
  usuarioActivo.nombre.charAt(0).toUpperCase();

}

function cerrarSesion(){

  // ELIMINAR SESION
  localStorage.removeItem("usuarioActivo");

  // ELIMINAR FAVORITOS
  localStorage.removeItem("favoritos");

  // RECARGAR PAGINA
  window.location.reload();

}


</script>
</body>
</html>
